  # 実際の Let's Encrypt 証明書だが更新が止まって期限切れのため、
  # client.insecure で疎通確認しつつ証明書切れ自体も条件で検知する
  - name: アイスホッケー部
    group: 課外活動団体
    url: "https://nitech-icehockey.club.nitech.ac.jp/"
