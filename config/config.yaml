storage:
  type: sqlite
  path: /data/data.db

ui:
  title: NITech Status
  header: NITech Status
  dashboard-subheading: 本サイトは、個人が運営している非公式サイトです。名古屋工業大学とは一切関係ありません。

endpoints:
  # 全学
  - name: 大学公式サイト
    group: 全学
    url: "https://www.nitech.ac.jp/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  - name: 附属図書館
    group: 全学
